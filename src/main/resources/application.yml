spring:

  application:
    name: order-renew

  datasource:
    url: jdbc:h2:mem:db-test
    username: sa
    password:
    driver-class-name: org.h2.Driver

#  datasource:
#    url: jdbc:mariadb://localhost:3306/order_lt
#    username: root
#    password: root
#    driver-class-name: org.mariadb.jdbc.Driver
#    hikari:
#      maximum-pool-size: 20          # 비관적 락과 Lua 비교 시 동일하게 고정

  jpa:
    hibernate:
      ddl-auto: create               # 기동할 때마다 테이블 새로 생성 (테스트용)
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

  profiles:
    active: loadtest

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(%-40.40logger{39}){cyan} : %m%n"
  level:
    root: INFO
    co.kr.order: INFO


custom:

  data:
    redis:
      host: localhost
      port: 6379

  # 부하 테스트용
  stock:
    strategy: redis  # redis | db-lock